group = "cloud.trustpin.flutter.sdk"
version = "6.3.0"

buildscript {
    ext.kotlin_version = "2.3.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.7.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "cloud.trustpin.flutter.sdk"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        // 25 is the floor imposed by cloud.trustpin:kotlin-sdk.
        // Apps consuming this plugin must declare minSdk >= 25.
        minSdk = 25
    }

    dependencies {
        // Pin the native SDK to the 6.3.x patch line. `strictly` prevents
        // Gradle's conflict resolution from silently selecting a newer
        // minor/major pulled in transitively by the consuming app.
        implementation("cloud.trustpin:kotlin-sdk") {
            version {
                strictly("[6.3.0, 6.4.0)")
            }
        }

        testImplementation("org.jetbrains.kotlin:kotlin-test-junit5")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
