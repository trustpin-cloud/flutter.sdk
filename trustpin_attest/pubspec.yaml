name: trustpin_attest
description: "TrustPin app attestation for Flutter: proves to your API that requests come from your genuine app on a genuine device, checked by your own TrustPin verifier."
version: 7.1.1
homepage: https://github.com/trustpin-cloud/flutter.sdk
repository: https://github.com/trustpin-cloud/flutter.sdk/tree/main/trustpin_attest
issue_tracker: https://github.com/trustpin-cloud/flutter.sdk/issues
documentation: https://docs.trustpin.cloud
topics:
  - security
  - attestation
  - networking

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  # The same 7.1.x line as this package: the native attestation module is
  # paired with, and registers itself on, the pinning SDK's instances, so
  # both plugins must resolve the same native SDK version.
  trustpin_sdk: '>=7.1.0 <7.2.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: cloud.trustpin.flutter.attest
        pluginClass: TrustPinAttestPlugin
      ios:
        pluginClass: TrustPinAttestPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: TrustPinAttestPlugin
        sharedDarwinSource: true
